name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          # pipefail ist noetig: ohne ihn verschluckt tee den Exit-Code von
          # Gradle und der Schritt meldet Erfolg, obwohl nichts gebaut wurde.
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee gradle-build.log

      # Gradle-/kotlinc-Fehler als Check-Annotation ausgeben: sie stehen
      # direkt am Commit und sind ohne Login ueber die API auslesbar.
      - name: Buildfehler ausgeben
        if: always()
        run: |
          if [ -f gradle-build.log ]; then
            tr -d '\r' < gradle-build.log |
              grep -E '^e: |error:|ERROR|FAILURE:|^> Task .* FAILED|What went wrong' |
              head -30 |
              while IFS= read -r line; do
                echo "::error::$line"
              done
          fi
          exit 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATPanther-debug
          path: app/build/outputs/apk/debug/app-debug.apk
