name: Android Debug Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug 2>&1 | tee gradle-build.log

      # Gradle-Fehler als Check-Annotation ausgeben: sie erscheinen direkt am
      # Commit und lassen sich ohne Login ueber die API auslesen.
      - name: Buildfehler ausgeben
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            tr -d '\r' < gradle-build.log |
              grep -E '^e: |error: |ERROR: error|FAILURE:|^> Task .* FAILED|AAPT: error' |
              head -25 |
              while IFS= read -r line; do
                echo "::error::$line"
              done
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-Panther-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7