name: Redmi Note 9 Pro - Version 1 Build

# Baut die 1:1-Kopie der ersten Redmi-Note-9-Pro-Variante
# (Ordner "Redmi Note 9 Pro - Version 1/", byte-identisch zu
# "Redmi Note 9 Pro - Version 1 Recovery/") als eigenes APK.
#
# Der Ordner ist ein eigenstaendiges Gradle-Projekt – daher wird mit
# working-directory hineingewechselt und dessen eigener Wrapper genutzt.
#
# Release-APK: Alle Builds (Debug + Release) laufen via GitHub Actions.
# Falls die Repo-Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS und ANDROID_KEY_PASSWORD gesetzt sind, wird das
# Release-APK signiert; ohne Secrets wird es unsigniert gebaut.

on:
  push:
    branches: [ main, master ]
    paths:
      - "Redmi Note 9 Pro - Version 1/**"
      - ".github/workflows/redmi-note-9-pro-version-1.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - "Redmi Note 9 Pro - Version 1/**"
      - ".github/workflows/redmi-note-9-pro-version-1.yml"
  workflow_dispatch:

# Signaturen-Freischaltung: Secret gesetzt => Release-APK wird gebaut+signiert.
env:
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Redmi Note 9 Pro - Version 1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "ATP_KEYSTORE_PATH=$GITHUB_WORKSPACE/Redmi Note 9 Pro - Version 1/release.keystore" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          # pipefail ist noetig: ohne ihn verschluckt tee den Exit-Code von
          # Gradle und der Schritt meldet Erfolg, obwohl nichts gebaut wurde.
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee gradle-build.log

      # Gradle-/kotlinc-Fehler als Check-Annotation ausgeben: sie stehen
      # direkt am Commit und sind ohne Login ueber die API auslesbar.
      - name: Buildfehler ausgeben
        if: always()
        run: |
          if [ -f gradle-build.log ]; then
            tr -d '\r' < gradle-build.log |
              grep -E '^e: |error:|ERROR|FAILURE:|^> Task .* FAILED|What went wrong' |
              head -30 |
              while IFS= read -r line; do
                echo "::error::$line"
              done
          fi
          exit 0

      - name: Build Release APK (alle Builds laufen via Actions)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APKs (getrennte Debug-/Release-Dateinamen)
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "AT Panther Redmi Note 9 Pro Version 1 Debug.apk"
          mv app/build/outputs/apk/release/app-release.apk "AT Panther Redmi Note 9 Pro Version 1 Release.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-Panther-RedmiNote9Pro-Version1-debug-apk
          path: "Redmi Note 9 Pro - Version 1/AT Panther Redmi Note 9 Pro Version 1 Debug.apk"
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-Panther-RedmiNote9Pro-Version1-release-apk
          path: "Redmi Note 9 Pro - Version 1/AT Panther Redmi Note 9 Pro Version 1 Release.apk"
          retention-days: 14
