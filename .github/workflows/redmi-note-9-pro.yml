name: Redmi Note 9 Pro Build

# Baut die Geraete-Variante fuer Xiaomi Redmi Note 9 Pro (Android 11, MIUI).
# Der Ordner ist ein eigenstaendiges Gradle-Projekt – daher wird mit
# working-directory hineingewechselt und dessen eigener Wrapper genutzt.
#
# Release-APK: Falls im Repo-Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS und ANDROID_KEY_PASSWORD gesetzt sind, wird ein signiertes
# Release-APK erzeugt; ohne Secrets nur Debug-APK.

on:
  push:
    branches: [ main, master ]
    paths:
      - "Redmi Note 9 Pro/**"
      - ".github/workflows/redmi-note-9-pro.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - "Redmi Note 9 Pro/**"
      - ".github/workflows/redmi-note-9-pro.yml"
  workflow_dispatch:

# Signaturen-Freischaltung: Secret gesetzt => Release-APK wird gebaut+signiert.
env:
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Redmi Note 9 Pro"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "ATP_KEYSTORE_PATH=$GITHUB_WORKSPACE/Redmi Note 9 Pro/release.keystore" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build Release APK (nur mit Keystore-Secrets)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK (AT Panther Redmi Note 9 Pro.apk)
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "AT Panther Redmi Note 9 Pro.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            mv app/build/outputs/apk/release/app-release.apk "AT Panther Redmi Note 9 Pro.apk"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AT-Panther-RedmiNote9Pro-debug-apk
          path: "Redmi Note 9 Pro/AT Panther Redmi Note 9 Pro.apk"
          retention-days: 14

      - name: Upload Release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AT-Panther-RedmiNote9Pro-release-apk
          path: "Redmi Note 9 Pro/AT Panther Redmi Note 9 Pro.apk"
          retention-days: 14
