name: Windows Build (portable EXE)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish portable EXE
        run: >
          dotnet publish windows/AT.Panther/AT.Panther.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o windows/out

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: ATPanther-Windows-portable
          path: windows/out/ATPanther.exe
          retention-days: 14
