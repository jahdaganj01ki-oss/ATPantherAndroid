name: Windows Build (AT Panther WPF)

# Baut die Windows-Variante (WPF, .NET 8) als self-contained Single-File-EXE.
# Pfadfiltert wie x11pro.yml, zusaetzlich manueller Start.

on:
  push:
    branches: [ main, master ]
    paths:
      - "Windows/**"
      - "worker/**"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - "Windows/**"
      - "worker/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ATPanther.sln

      - name: Build Release
        run: dotnet build ATPanther.sln -c Release --no-restore

      - name: Test
        run: dotnet test ATPanther.sln -c Release --no-build

      # EnableCompressionInSingleFile: die self-contained EXE ist ohne
      # Kompression ~150 MB gross; damit wird sie auf ~60 MB geschrumpft.
      # Wichtig fuer die Veroeffentlichung als GitHub-Actions-Artifact.
      - name: Publish win-x64 (self-contained single-file)
        run: dotnet publish src/ATPanther/ATPanther.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/win-x64

      - name: Artifact-Groesse pruefen
        run: |
          $exe = Get-ChildItem publish/win-x64/*.exe | Select-Object -First 1
          if (-not $exe) { throw "Keine EXE im Publish-Ordner" }
          Write-Host ("   {0}: {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB))
          if ($exe.Length -lt 30MB) {
            throw "EXE ist verdächtig klein ($($exe.Length) Bytes) – Single-File-Publish fehlgeschlagen?"
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AT-Panther-Windows-win-x64
          path: Windows/publish/win-x64/*.exe
          retention-days: 14
